[tool.poetry]
name = "cvs-review-portal"
version = "0.1.0"
description = "review portal"
readme = "README.md"
packages = [{ include = "cvs_review_portal", from = "src" }]
include = [
    { path = "src/cvs_review_portal/web/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic-settings = "^2.4.0"
filelock = "^4.1.1"
azure-storage-blob = "^12.31.0"
azure-identity = "^1.26.0"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
pyright = "^1.1.380"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
